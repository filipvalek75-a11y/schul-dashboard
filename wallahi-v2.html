<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WALLAHI – Brainrot Survival</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#11162a;color:#fff;font-family:system-ui,sans-serif}a{color:#fff}.g{max-width:1050px;margin:auto;background:linear-gradient(145deg,#090d1a,#19162d);padding:16px;border-radius:22px}.top,.stats,.controls{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{margin:10px 0}.pill{background:#202943;padding:8px 11px;border-radius:10px;font-weight:800}button{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;background:#7657ff;color:white}#wallahi-game-canvas{width:100%;aspect-ratio:16/9;display:block;background:#030713;border:2px solid #30405e;border-radius:16px;touch-action:none}.stage{position:relative}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#030713c9;border-radius:16px;text-align:center;padding:20px}.overlay[hidden]{display:none}.panel{max-width:520px;background:#151d33;padding:20px;border-radius:18px}.energy{width:130px;height:8px;background:#30384d;border-radius:9px;overflow:hidden}.energy i{display:block;height:100%;background:linear-gradient(90deg,#56f2cc,#ffe45c);width:100%}.controls{margin-top:10px;justify-content:center}.controls button{min-width:80px;touch-action:none}.wall{background:linear-gradient(135deg,#ff4fd8,#ff743d);font-size:18px}@media(max-width:700px){#wallahi-game-canvas{aspect-ratio:9/13}.stats{font-size:12px}.controls button{flex:1;min-height:55px}}</style></head><body><div class="g"><a href="index.html">← Zurück zur Übersicht</a><div class="top"><h1>🧠 WALLAHI – Brainrot Survival</h1><button id="snd">🔊 Sound</button></div><div class="stats"><span class="pill">Punkte <b id="sc">0</b></span><span class="pill">Highscore <b id="hi">0</b></span><span class="pill">Leben <b id="lv">❤️❤️❤️</b></span><span class="pill">WALLAHI <span class="energy"><i id="en"></i></span></span></div><div class="stage"><canvas id="wallahi-game-canvas" width="960" height="540"></canvas><div class="overlay" id="start"><div class="panel"><h2>Die echten Kalender-Brainrots sind los 💀</h2><p>A / D oder Pfeile bewegen · Leertaste springen · E / Enter = WALLAHI-Schockwelle · P Pause</p><button id="go">SPIEL STARTEN</button></div></div><div class="overlay" id="over" hidden><div class="panel"><h2>💀 GAME OVER</h2><p id="result"></p><button id="again">NOCHMAL</button></div></div></div><div class="controls"><button id="left">⬅️</button><button id="jump">🦘</button><button id="right">➡️</button><button class="wall" id="wall">💥 WALLAHI!</button></div></div><script src="wallahi-calendar-skins.js"></script><script>(()=>{'use strict';const c=document.getElementById('wallahi-game-canvas'),x=c.getContext('2d'),sc=document.getElementById('sc'),hi=document.getElementById('hi'),lv=document.getElementById('lv'),en=document.getElementById('en'),start=document.getElementById('start'),over=document.getElementById('over');let run=false,pause=false,last=0,score=0,high=+localStorage.getItem('wallahi-game-highscore')||0,spawn=0,t=0,sound=true,ac;hi.textContent=high;const keys={l:false,r:false},p={x:480,y:480,vy:0,lives:3,energy:100,inv:0},foes=[],parts=[];const names=Object.keys(window.WALLAHI_BRAINROT_SKINS||{});function audio(f=300,d=.08){if(!sound)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g).connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}function reset(){score=t=spawn=0;p.x=c.width/2;p.y=c.height-55;p.vy=0;p.lives=3;p.energy=100;p.inv=0;foes.length=parts.length=0;run=true;pause=false;start.hidden=true;over.hidden=true;last=performance.now();requestAnimationFrame(loop)}function enemy(){const n=names[Math.floor(Math.random()*names.length)]||'Tralalero Tralala',s=58+Math.random()*25;foes.push({name:n,img:window.WALLAHI_BRAINROT_IMAGES?.[n],x:Math.random()*(c.width-s),y:-s,w:s,h:s,v:110+Math.random()*80+t*1.5,phase:Math.random()*6})}function burst(a,b){for(let i=0;i<12;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,l:.5})}function wallahi(){if(!run||pause||p.energy<35)return;p.energy-=35;audio(120,.16);foes.forEach(e=>{if(Math.hypot(e.x+e.w/2-p.x,e.y+e.h/2-p.y)<260){e.dead=true;score+=35;burst(e.x,e.y)}})}function jump(){if(p.y>=c.height-56){p.vy=-420;audio(500)}}function hit(){if(p.inv>0)return;p.lives--;p.inv=1.2;audio(90,.15);if(p.lives<=0){run=false;high=Math.max(high,Math.floor(score));localStorage.setItem('wallahi-game-highscore',high);hi.textContent=high;document.getElementById('result').textContent=Math.floor(score)+' Punkte · '+(score>1500?'Wallahi-Legende':score>600?'Stabiler Brainrot-Kämpfer':'Noch nicht halal genug');over.hidden=false}}function upd(dt){t+=dt;score+=dt*10;p.inv=Math.max(0,p.inv-dt);p.energy=Math.min(100,p.energy+8*dt);p.x+=((keys.r?1:0)-(keys.l?1:0))*330*dt;p.x=Math.max(25,Math.min(c.width-25,p.x));p.vy+=900*dt;p.y+=p.vy*dt;if(p.y>c.height-55){p.y=c.height-55;p.vy=0}spawn-=dt;if(spawn<=0){enemy();spawn=Math.max(.25,.9-t/100)}const pb={x:p.x-22,y:p.y-48,w:44,h:48};foes.forEach(e=>{e.phase+=dt*2;e.y+=e.v*dt;e.x+=Math.sin(e.phase)*35*dt;if(!e.dead&&e.x<pb.x+pb.w&&e.x+e.w>pb.x&&e.y<pb.y+pb.h&&e.y+e.h>pb.y){e.dead=true;hit()}if(e.y>c.height+60)e.dead=true});for(let i=foes.length-1;i>=0;i--)if(foes[i].dead)foes.splice(i,1);parts.forEach(q=>{q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt});for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);sc.textContent=Math.floor(score);lv.textContent='❤️'.repeat(p.lives)||'💀';en.style.width=p.energy+'%'}function draw(){const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#070b1c');g.addColorStop(1,'#190e29');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';for(let i=0;i<50;i++)x.fillRect((i*193)%c.width,(i*89+t*15)%c.height,2,2);foes.forEach(e=>{x.save();x.beginPath();x.roundRect(e.x,e.y,e.w,e.h,12);x.clip();if(e.img?.complete&&e.img.naturalWidth){x.drawImage(e.img,e.x,e.y,e.w,e.h)}else{x.fillStyle='#8b5cf6';x.fillRect(e.x,e.y,e.w,e.h)}x.restore();x.fillStyle='rgba(0,0,0,.72)';x.fillRect(e.x,e.y+e.h-14,e.w,14);x.fillStyle='#fff';x.font='bold 8px sans-serif';x.textAlign='center';x.fillText(e.name,e.x+e.w/2,e.y+e.h-4)});x.save();if(p.inv>0)x.globalAlpha=.45+.4*Math.sin(t*20);x.fillStyle='#61f7d6';x.fillRect(p.x-20,p.y-38,40,38);x.fillStyle='#f1c39e';x.beginPath();x.arc(p.x,p.y-48,15,0,7);x.fill();x.fillStyle='#111';x.font='bold 15px sans-serif';x.textAlign='center';x.fillText('W',p.x,p.y-13);x.restore();parts.forEach(q=>{x.globalAlpha=Math.max(0,q.l*2);x.fillStyle='#ff4fd8';x.fillRect(q.x,q.y,5,5)});x.globalAlpha=1}function loop(n){if(!run||pause)return;const dt=Math.min((n-last)/1000,.033);last=n;upd(dt);draw();requestAnimationFrame(loop)}function kd(e){if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.l=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.r=true;if(e.key===' ')jump();if(e.key.toLowerCase()==='e'||e.key==='Enter')wallahi();if(e.key.toLowerCase()==='p'){pause=!pause;if(!pause){last=performance.now();requestAnimationFrame(loop)}}}addEventListener('keydown',kd,{passive:false});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.l=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.r=false});function hold(id,k){const el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();keys[k]=true};['onpointerup','onpointercancel','onpointerleave'].forEach(a=>el[a]=e=>{e.preventDefault();keys[k]=false})}hold('left','l');hold('right','r');document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};document.getElementById('wall').onpointerdown=e=>{e.preventDefault();wallahi()};document.getElementById('go').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('snd').onclick=()=>{sound=!sound;document.getElementById('snd').textContent=sound?'🔊 Sound':'🔇 Sound'};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause=true});draw()})();</script></body></html>
