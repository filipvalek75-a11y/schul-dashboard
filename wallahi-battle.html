<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WALLAHI – Brainrot Battle</title><style>*{box-sizing:border-box}body{margin:0;background:#070817;color:#fff;font-family:system-ui,Segoe UI,sans-serif;overflow-x:hidden}.wallahi-battle-wrap{max-width:1100px;margin:auto;padding:14px}.wallahi-battle-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}.wallahi-battle-top a{color:#8cf;text-decoration:none}.wallahi-battle-hud{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.wallahi-battle-pill{background:#171b39;border:1px solid #343d75;border-radius:10px;padding:7px 10px;font-weight:800}.wallahi-battle-stage{position:relative}.wallahi-battle-stage canvas{width:100%;aspect-ratio:16/9;display:block;border:2px solid #5946ff;border-radius:18px;background:#090b20;touch-action:none;box-shadow:0 0 35px #633cff55}.wallahi-battle-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050614cc;border-radius:18px;z-index:5}.wallahi-battle-panel{width:min(90%,620px);max-height:90%;overflow:auto;text-align:center;background:#12152f;border:1px solid #735cff;border-radius:18px;padding:20px}.wallahi-battle-panel h1{font-size:clamp(27px,5vw,50px);margin:0;background:linear-gradient(90deg,#f0f,#0ff,#ff0);-webkit-background-clip:text;color:transparent}.wallahi-battle-btn{border:0;border-radius:11px;padding:11px 15px;margin:5px;font-weight:900;background:linear-gradient(135deg,#7652ff,#e445ff);color:white;cursor:pointer}.wallahi-battle-btn:disabled{opacity:.3}.wallahi-battle-shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.wallahi-battle-shop button{background:#1b2044;color:#fff;border:1px solid #49518b;border-radius:12px;padding:10px}.wallahi-battle-boss{display:none;margin:5px 0}.wallahi-battle-bar{height:14px;background:#222;border-radius:20px;overflow:hidden}.wallahi-battle-bar span{display:block;height:100%;background:linear-gradient(90deg,#ff1744,#ff9800);width:100%}.wallahi-battle-touch{display:none;justify-content:space-between;gap:8px;margin-top:10px;touch-action:none}.wallahi-battle-pad,.wallahi-battle-actions{display:grid;grid-template-columns:repeat(3,55px);gap:5px}.wallahi-battle-touch button{height:52px;border:0;border-radius:12px;background:#252b57;color:#fff;font-weight:900}.wallahi-battle-actions{grid-template-columns:repeat(3,58px)}@media(pointer:coarse),(max-width:700px){.wallahi-battle-touch{display:flex}.wallahi-battle-wrap{padding:6px}.wallahi-battle-hud{font-size:12px}.wallahi-battle-touch button{height:48px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="wallahi-battle-wrap"><div class="wallahi-battle-top"><a href="/">← Zurück zur Übersicht</a><b>🧠 WALLAHI – Brainrot Battle</b><button class="wallahi-battle-btn" id="wallahi-battle-sound">🔊</button></div><div class="wallahi-battle-hud"><span class="wallahi-battle-pill">❤️ <b id="wallahi-battle-hp">100/100</b></span><span class="wallahi-battle-pill">⚡ <b id="wallahi-battle-energy">100</b></span><span class="wallahi-battle-pill">💥 ULT <b id="wallahi-battle-ult">0%</b></span><span class="wallahi-battle-pill">🪙 <b id="wallahi-battle-coins">0</b></span><span class="wallahi-battle-pill">🌊 <b id="wallahi-battle-wave">1</b></span><span class="wallahi-battle-pill">🏆 <b id="wallahi-battle-score">0</b></span><span class="wallahi-battle-pill">🧪 <b id="wallahi-battle-potions">1</b></span></div><div class="wallahi-battle-boss" id="wallahi-battle-boss"><b>TUNG TUNG TUNG SAHUR</b><div class="wallahi-battle-bar"><span id="wallahi-battle-bossbar"></span></div></div><div class="wallahi-battle-stage"><canvas id="wallahi-battle-canvas" width="960" height="540"></canvas><div class="wallahi-battle-overlay" id="wallahi-battle-overlay"><div class="wallahi-battle-panel" id="wallahi-battle-panel"><h1>WALLAHI<br>BRAINROT BATTLE</h1><p>WASD/Pfeile bewegen · Klick Angriff · 1–4 Fähigkeiten · Space Dash · Q Heilung · E Rage · R Ultimate · P Pause</p><p>Überlebe 5 Wellen. Danach wartet <b>Tung Tung Tung Sahur</b>.</p><button class="wallahi-battle-btn" data-diff=".8">Easy</button><button class="wallahi-battle-btn" data-diff="1">Normal</button><button class="wallahi-battle-btn" data-diff="1.3">Wallahi Hard</button></div></div></div><div class="wallahi-battle-touch"><div class="wallahi-battle-pad"><i></i><button data-key="up">▲</button><i></i><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="wallahi-battle-actions"><button data-act="attack">👊</button><button data-act="dash">💨</button><button data-act="heal">🧪</button><button data-act="a1">1</button><button data-act="a2">2</button><button data-act="a3">3</button><button data-act="a4">4</button><button data-act="rage">E</button><button data-act="ult">ULT</button></div></div></main><script>(()=>{'use strict';const C=document.getElementById('wallahi-battle-canvas'),x=C.getContext('2d'),O=document.getElementById('wallahi-battle-overlay'),P=document.getElementById('wallahi-battle-panel'),bossUI=document.getElementById('wallahi-battle-boss');const ui={hp:document.getElementById('wallahi-battle-hp'),energy:document.getElementById('wallahi-battle-energy'),ult:document.getElementById('wallahi-battle-ult'),coins:document.getElementById('wallahi-battle-coins'),wave:document.getElementById('wallahi-battle-wave'),score:document.getElementById('wallahi-battle-score'),potions:document.getElementById('wallahi-battle-potions'),boss:document.getElementById('wallahi-battle-bossbar')};let running=false,paused=false,last=0,diff=1,wave=1,score=0,coins=0,kills=0,startTime=0,between=false,boss=null,shake=0,sound=localStorage.getItem('wbSound')!=='0';const keys={},shots=[],enemies=[],drops=[],fx=[],hazards=[];const pl={x:480,y:300,r:18,hp:100,max:100,energy:100,ult:0,potions:1,speed:220,damage:12,rate:.22,lastAtk:0,cdr:1,crit:.1,lifesteal:0,shield:0,revive:0,rage:0,inv:0,dash:0,dir:{x:1,y:0},upgrades:[]};let ac;function beep(f=220,d=.05,type='square',v=.04){if(!sound)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}function reset(){wave=1;score=coins=kills=0;boss=null;Object.assign(pl,{x:480,y:300,hp:100,max:100,energy:100,ult:0,potions:1,speed:220,damage:12,rate:.22,lastAtk:0,cdr:1,crit:.1,lifesteal:0,shield:0,revive:0,rage:0,inv:0,dash:0,upgrades:[]});shots.length=enemies.length=drops.length=fx.length=hazards.length=0;startTime=performance.now();spawnWave()}function spawnWave(){between=false;enemies.length=0;const n=4+wave*2;for(let i=0;i<n;i++)spawnEnemy(i%7);flash('WELLE '+wave);if(wave===6)spawnBoss()}const types=[['Tralalero',290,22,'#28e7ff'],['Bombardiro',120,55,'#758cff'],['Ballerina',150,40,'#ff65d8'],['Assassino',180,35,'#eee'],['Bananini',140,45,'#ffe642'],['Lirili',110,48,'#64ff8d'],['Frigo',125,60,'#86d8ff']];function spawnEnemy(t){const q=types[t],edge=Math.random()*4|0,e={type:t,name:q[0],x:edge===0?20:edge===1?940:Math.random()*900+30,y:edge===2?20:edge===3?520:Math.random()*480+30,r:16,hp:q[2]*(1+wave*.13)*diff,max:q[2]*(1+wave*.13)*diff,speed:q[1]*(1+wave*.04)*diff,color:q[3],atk:Math.random(),elite:Math.random()<wave*.05};if(e.elite){e.r=24;e.hp*=2;e.max=e.hp;e.speed*=1.15}enemies.push(e)}function spawnBoss(){enemies.length=0;boss={x:480,y:100,r:48,hp:1300*diff,max:1300*diff,phase:1,atk:2};bossUI.style.display='block';flash('⚠️ TUNG TUNG TUNG SAHUR ⚠️')}function flash(t){fx.push({text:t,x:480,y:250,life:1.4,big:true})}function attack(){const now=performance.now()/1000;if(now-pl.lastAtk<pl.rate*pl.cdr/(pl.rage>0?1.8:1))return;pl.lastAtk=now;const m=mouse||{x:pl.x+pl.dir.x*100,y:pl.y+pl.dir.y*100},a=Math.atan2(m.y-pl.y,m.x-pl.x);shots.push({x:pl.x,y:pl.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,r:6,d:pl.damage*(pl.rage>0?1.6:1),pierce:0,life:1});beep(170,.035)}function ability(n){if(pl.energy<(n===1?12:n===2?22:n===3?28:18))return;if(n===1){pl.energy-=12;for(let i=-1;i<=1;i++){const a=Math.atan2(pl.dir.y,pl.dir.x)+i*.16;shots.push({x:pl.x,y:pl.y,vx:Math.cos(a)*500,vy:Math.sin(a)*500,r:10,d:pl.damage*1.2,pierce:1,life:1})}}if(n===2){pl.energy-=22;shots.push({x:pl.x,y:pl.y,vx:pl.dir.x*420,vy:pl.dir.y*420,r:22,d:pl.damage*2.2,pierce:5,life:1.5})}if(n===3){pl.energy-=28;enemies.forEach(e=>{if(dist(pl,e)<130)hurtEnemy(e,pl.damage*2)});if(boss&&dist(pl,boss)<150)hurtBoss(pl.damage*2);fx.push({x:pl.x,y:pl.y,r:140,life:.5})}if(n===4){pl.energy-=18;dash()}beep(420,.08,'sawtooth')}function dash(){if(pl.dash>0)return;pl.dash=.55;pl.inv=.35;pl.x+=pl.dir.x*90;pl.y+=pl.dir.y*90;shake=5;enemies.forEach(e=>{if(dist(pl,e)<70)hurtEnemy(e,pl.damage*1.5)})}function rage(){if(pl.energy<50)return;pl.energy-=50;pl.rage=5;flash('WALLAHI!');beep(90,.3,'sawtooth',.08)}function ultimate(){if(pl.ult<100)return;pl.ult=0;enemies.slice().forEach(e=>hurtEnemy(e,120));if(boss)hurtBoss(220);shake=18;for(let i=0;i<35;i++)fx.push({x:Math.random()*960,y:Math.random()*540,r:20+Math.random()*60,life:.7});flash('💥 ULTIMATE WALLAHI 💥');beep(55,.7,'sawtooth',.1)}function heal(){if(pl.potions<1||pl.hp>=pl.max)return;pl.potions--;pl.hp=Math.min(pl.max,pl.hp+45);fx.push({x:pl.x,y:pl.y,r:70,life:.7,heal:true});beep(600,.18,'sine')}function hurtEnemy(e,d){const crit=Math.random()<pl.crit;d*=crit?2:1;e.hp-=d;pl.ult=Math.min(100,pl.ult+d*.22);if(pl.lifesteal)pl.hp=Math.min(pl.max,pl.hp+d*pl.lifesteal);fx.push({text:(crit?'CRIT ':'')+Math.round(d),x:e.x,y:e.y,life:.5,crit});if(e.hp<=0){kills++;score+=Math.round(e.max*2);coins+=5+(e.elite?15:0);if(Math.random()<.15)drops.push({x:e.x,y:e.y,type:Math.random()<.35?'heal':'coin',r:9});enemies.splice(enemies.indexOf(e),1);beep(330,.05)}}function hurtBoss(d){if(!boss)return;boss.hp-=d;pl.ult=Math.min(100,pl.ult+d*.15);if(boss.hp<=0){victory();return}const phase=boss.hp<boss.max*.33?3:boss.hp<boss.max*.66?2:1;if(phase!==boss.phase){boss.phase=phase;flash('PHASE '+phase+'!');shake=12}}function damagePlayer(d){if(pl.inv>0)return;if(pl.shield>0){pl.shield--;return}pl.hp-=d;pl.inv=.35;shake=8;beep(100,.1);if(pl.hp<=0){if(pl.revive){pl.revive=0;pl.hp=pl.max*.5;flash('REVIVE!')}else gameOver()}}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}let mouse=null;C.addEventListener('pointermove',e=>{const r=C.getBoundingClientRect();mouse={x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*540/r.height}});C.addEventListener('pointerdown',e=>{e.preventDefault();attack()});function update(dt){if(!running||paused||between)return;pl.inv=Math.max(0,pl.inv-dt);pl.dash=Math.max(0,pl.dash-dt);pl.rage=Math.max(0,pl.rage-dt);pl.energy=Math.min(100,pl.energy+12*dt);let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;pl.dir={x:dx,y:dy};const sp=pl.speed*(pl.rage>0?1.35:1)*(pl.dash>0?2.2:1);pl.x+=dx*sp*dt;pl.y+=dy*sp*dt}pl.x=Math.max(20,Math.min(940,pl.x));pl.y=Math.max(25,Math.min(515,pl.y));shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(const e of enemies.slice())if(dist(s,e)<s.r+e.r){hurtEnemy(e,s.d);if(s.pierce-->0){}else{s.life=0;break}}if(boss&&dist(s,boss)<s.r+boss.r){hurtBoss(s.d);s.life=0}});for(let i=shots.length-1;i>=0;i--)if(shots[i].life<=0)shots.splice(i,1);enemies.forEach(e=>{let dx=pl.x-e.x,dy=pl.y-e.y,l=Math.hypot(dx,dy)||1;e.atk-=dt;if(e.type===3&&e.atk<0){e.x=pl.x-pl.dir.x*80;e.y=pl.y-pl.dir.y*80;e.atk=3}else{e.x+=dx/l*e.speed*dt;e.y+=dy/l*e.speed*dt}if((e.type===1||e.type===4||e.type===6)&&e.atk<0){hazards.push({x:e.x,y:e.y,vx:dx/l*180,vy:dy/l*180,r:8,life:3,d:e.type===6?10:8});e.atk=1.5+Math.random()}if(e.type===5&&e.atk<0){enemies.forEach(o=>o.hp=Math.min(o.max,o.hp+8));e.atk=2}if(dist(pl,e)<pl.r+e.r+3){damagePlayer(e.type===2?14:8);e.x-=dx/l*20;e.y-=dy/l*20}});hazards.forEach(h=>{h.x+=h.vx*dt;h.y+=h.vy*dt;h.life-=dt;if(dist(pl,h)<pl.r+h.r){damagePlayer(h.d);h.life=0}});for(let i=hazards.length-1;i>=0;i--)if(hazards[i].life<=0)hazards.splice(i,1);drops.forEach(d=>{if(dist(pl,d)<30){if(d.type==='heal')pl.hp=Math.min(pl.max,pl.hp+20);else coins+=10;d.dead=1;beep(700,.05)}});for(let i=drops.length-1;i>=0;i--)if(drops[i].dead)drops.splice(i,1);if(boss)updateBoss(dt);if(!boss&&enemies.length===0)openShop();fx.forEach(f=>f.life-=dt);for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1);shake=Math.max(0,shake-dt*25)}function updateBoss(dt){boss.atk-=dt;let dx=pl.x-boss.x,dy=pl.y-boss.y,l=Math.hypot(dx,dy)||1;boss.x+=dx/l*(35+boss.phase*18)*dt;if(boss.atk<=0){const count=boss.phase+1;for(let i=0;i<count;i++){const a=Math.atan2(dy,dx)+(i-(count-1)/2)*.35;hazards.push({x:boss.x,y:boss.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,r:14,life:4,d:15})}if(Math.random()<.45)spawnEnemy(Math.random()*7|0);boss.atk=2.3-boss.phase*.35;flash(boss.phase===3?'TUNG TUNG RAGE!':'SCHOCKWELLE!');beep(70,.2,'square',.07)}if(dist(pl,boss)<pl.r+boss.r)damagePlayer(18)}function openShop(){between=true;coins+=20+wave*5;O.style.display='flex';const items=[['🩹 Heilung',20,()=>pl.hp=Math.min(pl.max,pl.hp+40)],['❤️ Max HP +20',45,()=>{pl.max+=20;pl.hp+=20}],['🧪 Heiltrank',25,()=>pl.potions++],['⚔️ Schaden +20%',50,()=>pl.damage*=1.2],['⚡ Angriff schneller',55,()=>pl.rate*=.88],['⏱ Cooldowns',45,()=>pl.cdr*=.9],['👟 Tempo',35,()=>pl.speed*=1.12],['💥 Krit +8%',50,()=>pl.crit+=.08],['🩸 Lebensraub',70,()=>pl.lifesteal+=.05],['🛡 Schild',35,()=>pl.shield+=2],['✨ Wiederbelebung',100,()=>pl.revive=1],['🎁 Mystery',40,()=>{pl.damage*=1+Math.random()*.25;pl.max+=Math.random()*15|0}]];P.innerHTML='<h2>🛒 Wellen-Shop</h2><p>🪙 <b id="shopcoins">'+coins+'</b> · Welle '+wave+' geschafft!</p><div class="wallahi-battle-shop">'+items.map((a,i)=>'<button data-buy="'+i+'">'+a[0]+'<br><b>'+a[1]+' 🪙</b></button>').join('')+'</div><button class="wallahi-battle-btn" id="nextwave">Nächste Welle ▶</button>';P.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.buy];if(coins>=it[1]){coins-=it[1];it[2]();pl.upgrades.push(it[0]);document.getElementById('shopcoins').textContent=coins;beep(520,.08);refreshShop(items)}});document.getElementById('nextwave').onclick=()=>{wave++;O.style.display='none';if(wave===6)spawnBoss();else spawnWave()};refreshShop(items)}function refreshShop(items){P.querySelectorAll('[data-buy]').forEach(b=>b.disabled=coins<items[+b.dataset.buy][1])}function gameOver(){running=false;O.style.display='flex';const hs=Math.max(score,+localStorage.getItem('wallahiBattleHighscore')||0);localStorage.setItem('wallahiBattleHighscore',hs);P.innerHTML='<h1>GAME OVER</h1><p>Punkte '+score+' · Kills '+kills+' · Highscore '+hs+'</p><button class="wallahi-battle-btn" onclick="location.reload()">Neustart</button>'}function victory(){running=false;boss=null;bossUI.style.display='none';O.style.display='flex';const sec=((performance.now()-startTime)/1000)|0;score+=2000;localStorage.setItem('wallahiBattleHighscore',Math.max(score,+localStorage.getItem('wallahiBattleHighscore')||0));P.innerHTML='<h1>TUNG TUNG BESIEGT!</h1><p>🏆 '+score+' Punkte · ⏱ '+sec+'s · 💀 '+kills+' Gegner</p><p>Verbesserungen: '+(pl.upgrades.join(' · ')||'keine')+'</p><button class="wallahi-battle-btn" onclick="location.reload()">Nochmal</button>'}function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const g=x.createLinearGradient(0,0,960,540);g.addColorStop(0,pl.rage>0?'#35000b':'#080c25');g.addColorStop(1,'#17062a');x.fillStyle=g;x.fillRect(0,0,960,540);for(let i=0;i<50;i++){x.fillStyle='#ffffff55';x.fillRect((i*193+performance.now()*.01)%960,(i*97)%540,2,2)}drops.forEach(d=>{x.font='20px sans-serif';x.fillText(d.type==='heal'?'💚':'🪙',d.x-10,d.y+8)});hazards.forEach(h=>{x.fillStyle='#ff543e';x.beginPath();x.arc(h.x,h.y,h.r,0,7);x.fill()});shots.forEach(s=>{x.shadowBlur=16;x.shadowColor='#55ffff';x.fillStyle='#76ffff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.shadowBlur=0});enemies.forEach(e=>drawEnemy(e));if(boss)drawBoss();drawPlayer();fx.forEach(f=>{x.globalAlpha=Math.max(0,f.life);if(f.text){x.textAlign='center';x.font=(f.big?'bold 42px':'bold 17px')+' sans-serif';x.fillStyle=f.crit?'#fff200':'#fff';x.fillText(f.text,f.x,f.y-f.life*20)}else{x.strokeStyle=f.heal?'#39ff78':'#ff40e6';x.lineWidth=5;x.beginPath();x.arc(f.x,f.y,f.r*(1-f.life*.3),0,7);x.stroke()}x.globalAlpha=1});x.restore();ui.hp.textContent=Math.max(0,pl.hp|0)+'/'+(pl.max|0);ui.energy.textContent=pl.energy|0;ui.ult.textContent=(pl.ult|0)+'%';ui.coins.textContent=coins;ui.wave.textContent=wave>5?'BOSS':wave;ui.score.textContent=score;ui.potions.textContent=pl.potions;if(boss)ui.boss.style.width=(boss.hp/boss.max*100)+'%'}function drawEnemy(e){x.save();x.translate(e.x,e.y);x.shadowBlur=e.elite?22:10;x.shadowColor=e.color;x.fillStyle=e.color;x.beginPath();x.arc(0,0,e.r,0,7);x.fill();x.fillStyle='#111';if(e.type===0){x.beginPath();x.moveTo(-e.r,0);x.lineTo(e.r,0);x.lineTo(0,e.r*.8);x.fill()}else if(e.type===1){x.fillRect(-e.r*.8,-4,e.r*1.6,8)}else if(e.type===2){x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(0,0,e.r*.7,0,5);x.stroke()}else if(e.type===4){x.font=e.r+'px sans-serif';x.fillText('🍌',-e.r/2,e.r/2)}else if(e.type===5){x.fillStyle='#fff';x.fillRect(-3,-e.r*.7,6,e.r*1.4);x.fillRect(-e.r*.7,-3,e.r*1.4,6)}else{x.fillStyle='#111';x.fillRect(-e.r*.6,-e.r*.6,e.r*1.2,e.r*1.2)}x.restore();x.fillStyle='#111';x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);x.fillStyle='#52ff7b';x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.max),4)}function drawPlayer(){x.save();x.translate(pl.x,pl.y);x.rotate(Math.atan2(pl.dir.y,pl.dir.x));x.shadowBlur=pl.rage>0?28:15;x.shadowColor=pl.rage>0?'red':'#a34cff';x.fillStyle=pl.inv>0?'#fff':'#8b4dff';x.beginPath();x.arc(0,0,pl.r,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(pl.r+12,0);x.
