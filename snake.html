<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake · Lernpause</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#172554 0,#07111f 42%,#020617 100%);color:#e5f7ff;display:flex;align-items:center;justify-content:center;padding:20px}.game{width:min(94vw,620px);background:rgba(7,17,31,.9);border:1px solid rgba(34,211,238,.3);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 36px rgba(34,211,238,.08);backdrop-filter:blur(10px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.title h1{margin:0;font-size:26px;letter-spacing:.3px}.title p{margin:5px 0 0;color:#8ba6bb;font-size:14px}.scorebar{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 11px;border-radius:999px;background:#0b1d2f;border:1px solid #16344d;font-weight:800}.board-wrap{position:relative;margin:18px auto 14px;width:min(100%,500px);aspect-ratio:1/1}.board-wrap canvas{width:100%;height:100%;display:block;background:linear-gradient(180deg,#06111d,#071522);border:1px solid #16405b;border-radius:18px;box-shadow:inset 0 0 35px rgba(34,211,238,.04),0 0 30px rgba(34,211,238,.08)}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.message{background:rgba(2,6,23,.82);border:1px solid rgba(34,211,238,.35);border-radius:16px;padding:14px 18px;text-align:center;max-width:82%;box-shadow:0 0 28px rgba(34,211,238,.12);opacity:0;transform:scale(.96);transition:.2s}.message.show{opacity:1;transform:scale(1)}.message b{display:block;font-size:22px;color:#67e8f9;margin-bottom:4px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer;color:#03121a;background:linear-gradient(135deg,#22d3ee,#2dd4bf);box-shadow:0 0 18px rgba(34,211,238,.22);transition:.15s}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:#0d2033;color:#b8d9eb;border:1px solid #21435b;box-shadow:none}.touch{display:none;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center;margin-top:10px}.touch button{background:#0c2235;border:1px solid #20506b;color:#67e8f9;border-radius:14px;font-size:23px;font-weight:900;touch-action:manipulation}.touch .up{grid-column:2}.touch .left{grid-column:1;grid-row:2}.touch .down{grid-column:2;grid-row:2}.touch .right{grid-column:3;grid-row:2}.hint{text-align:center;color:#7893a7;font-size:13px;margin:10px 0 0}.back{display:inline-block;margin-top:14px;color:#67e8f9;text-decoration:none;font-weight:800}@media(max-width:720px),(pointer:coarse){.touch{display:grid}.hint{font-size:12px}}@keyframes pulse{50%{filter:brightness(1.25)}}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <div class="title"><h1>🐍 Snake · Lernpause</h1><p>Kurz abschalten, dann weiterlernen.</p></div>
    <div class="scorebar"><div class="pill">Punkte: <span id="score">0</span></div><div class="pill">Highscore: <span id="highscore">0</span></div></div>
  </div>

  <div class="board-wrap">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="overlay"><div id="message" class="message show"><b>Bereit?</b><span>Drücke Start oder eine Richtungstaste.</span></div></div>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn">Start / Neustart</button>
    <button id="pauseBtn" class="btn secondary">Pause</button>
  </div>

  <div class="touch" aria-label="Touch-Steuerung">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
  <p class="hint">Steuerung: Pfeiltasten oder W · A · S · D · Leertaste = Pause</p>
  <a class="back" href="/">← Zurück zum Schul-Dashboard</a>
</div>
<script>
// --- Grundeinstellungen ---
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const highscoreEl=document.getElementById('highscore');
const messageEl=document.getElementById('message');
const startBtn=document.getElementById('startBtn');
const pauseBtn=document.getElementById('pauseBtn');
const grid=20;
const tiles=canvas.width/grid;
let snake,food,dir,nextDir,score,timer,running=false,paused=false,speed=125;
let highscore=Number(localStorage.getItem('snakeHighscore')||0);
highscoreEl.textContent=highscore;

function resetGame(){
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; speed=125; paused=false;
  scoreEl.textContent=score; pauseBtn.textContent='Pause'; placeFood(); draw();
}
function placeFood(){
  do{food={x:Math.floor(Math.random()*tiles),y:Math.floor(Math.random()*tiles)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function startGame(){
  clearTimeout(timer); resetGame(); running=true; hideMessage(); loop();
}
function loop(){
  if(!running||paused)return;
  step(); draw();
  if(running)timer=setTimeout(loop,speed);
}
function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=tiles||head.y>=tiles||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++; scoreEl.textContent=score; speed=Math.max(55,125-score*3); placeFood();
    if(score>highscore){highscore=score;highscoreEl.textContent=highscore;localStorage.setItem('snakeHighscore',String(highscore))}
  }else snake.pop();
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // feines Spielfeldraster
  ctx.strokeStyle='rgba(103,232,249,.035)';ctx.lineWidth=1;
  for(let i=0;i<=tiles;i++){ctx.beginPath();ctx.moveTo(i*grid,0);ctx.lineTo(i*grid,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*grid);ctx.lineTo(canvas.width,i*grid);ctx.stroke()}
  // Futter
  ctx.shadowBlur=18;ctx.shadowColor='#fb7185';ctx.fillStyle='#fb7185';
  ctx.beginPath();ctx.arc(food.x*grid+grid/2,food.y*grid+grid/2,grid*.34,0,Math.PI*2);ctx.fill();
  // Schlange
  snake.forEach((s,i)=>{ctx.shadowBlur=i===0?20:10;ctx.shadowColor='#22d3ee';ctx.fillStyle=i===0?'#67e8f9':'#2dd4bf';const p=2;ctx.fillRect(s.x*grid+p,s.y*grid+p,grid-p*2,grid-p*2)});
  ctx.shadowBlur=0;
}
function gameOver(){running=false;clearTimeout(timer);showMessage('Game Over',`Punkte: ${score} · Drücke Neustart.`)}
function togglePause(){
  if(!running)return;
  paused=!paused;pauseBtn.textContent=paused?'Weiter':'Pause';
  if(paused)showMessage('Pause','Kurze Lernpause in der Lernpause 😄');else{hideMessage();loop()}
}
function showMessage(title,text){messageEl.innerHTML=`<b>${title}</b><span>${text}</span>`;messageEl.classList.add('show')}
function hideMessage(){messageEl.classList.remove('show')}
function setDirection(name){
  const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const n=map[name];if(!n)return;
  if(n.x===-dir.x&&n.y===-dir.y)return;nextDir=n;
  if(!running)startGame();
}
const keyMap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
window.addEventListener('keydown',e=>{
  if(keyMap[e.key]){e.preventDefault();setDirection(keyMap[e.key])}
  if(e.code==='Space'){e.preventDefault();togglePause()}
},{passive:false});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(b.dataset.dir)}));
startBtn.addEventListener('click',startGame);pauseBtn.addEventListener('click',togglePause);
resetGame();
</script>
</body>
</html>
